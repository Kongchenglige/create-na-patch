plugins {
	id "dev.architectury.loom" version "1.7-SNAPSHOT"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17
archivesBaseName = project.archives_base_name

repositories {
	mavenLocal()
	maven { url = "https://maven.shedaniel.me/" } // Cloth Config, REI
	maven { url = "https://maven.blamejared.com/" } // JEI
	maven { url = "https://maven.parchmentmc.org" } // Parchment mappings
	maven { url = "https://api.modrinth.com/maven" } // Modrinth
	maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
	maven { url = "https://jitpack.io/" } // Mixin Extras
	maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
	maven { url = "https://maven.tterrag.com/" } // Registrate
	maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port
	maven {
		name = "Resourceful Bees Maven"
		url = "https://maven.resourcefulbees.com/repository/maven-public/"
	}
}

loom {
	mods {
		"create-new-age" {
			sourceSet sourceSets.main
		}
	}
	forge {
		mixinConfigs = [
			"create_new_age.mixins.json",
			"create.mixins.json"
		]
		runs {
			client {
				property("mixin.env.remapRefMap", "true")
				property("mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg")
			}
		}
	}
}

dependencies {
	minecraft("com.mojang:minecraft:${minecraft_version}")
	mappings loom.officialMojangMappings()

	forge "net.minecraftforge:forge:${project.forge_version}"

	// Create
	modImplementation("com.simibubi.create:create-${minecraft_version}:${project.create_version}:slim") { transitive = false }
	modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${project.ponder_version}")
	modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${project.flywheel_version}")
	modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${project.flywheel_version}")
	modImplementation("com.tterrag.registrate:Registrate:${project.registrate_version}")
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
	implementation("io.github.llamalad7:mixinextras-forge:0.4.1")

	// Botarium
	modImplementation "earth.terrarium:botarium-common-${minecraft_version}:${project.botarium_version}"
	modApi("earth.terrarium:botarium-forge-${minecraft_version}:${project.botarium_version}")

	// Recipe viewers
	modCompileOnly("dev.emi:emi-forge:${project.emi_version}");
	compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${project.jei_version}")
	compileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${project.jei_version}")
	modCompileOnly("me.shedaniel:RoughlyEnoughItems-forge:${project.rei_version}");

	switch (project.recipe_viewer.toLowerCase(Locale.ROOT)) {
		case "jei": modLocalRuntime("maven.modrinth:jei:${project.jei_runtime}"); break
		case "rei": modLocalRuntime("me.shedaniel:RoughlyEnoughItems-forge:${project.rei_version}"); break
		case "emi": modLocalRuntime("dev.emi:emi-forge:${project.emi_version}"); break
		case "disabled": break
		default: println("Unknown recipe viewer specified: ${project.recipe_viewer}. Must be JEI, REI, EMI, or disabled.")
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/mods.toml") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	manifest {
		attributes([
				"Specification-Title"     : "create-new-age",
				"Specification-Vendor"    : "AntarcticGardens",
				"Specification-Version"   : "1",
				"Implementation-Title"    : "Create: New Age",
				"Implementation-Version"  : "1",
				"Implementation-Vendor"   : "AntarcticGardens",
				"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}